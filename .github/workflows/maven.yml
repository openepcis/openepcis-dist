name: Build and publish snapshots

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # No credentials: the whole public stack is in this reactor and resolves from Central.
      - name: Build with Maven
        run: mvn -B --no-transfer-progress clean verify -DskipTests

  snapshots:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # 999-SNAPSHOT of every public module goes to Central's snapshot repository, which any
      # build can read without credentials. That is what lets the public repositories build
      # on GitHub between releases. Snapshots are not signed.
      - name: Publish snapshots to Central
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: mvn -B --no-transfer-progress -s .mvn/settings.xml clean deploy -DskipTests -Popenepcis-ossrh -Dgpg.skip=true
